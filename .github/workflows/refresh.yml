name: Refresh Goal Dashboard

on:
  schedule:
    - cron: '7 * * * *'        # every hour, at minute 7 (UTC). GitHub may delay scheduled runs by a few minutes
  push:
    branches: [main]           # code change -> rebuild and deploy right away, even if the Excel files did not change
    paths-ignore: ['README.md']
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and deploy even if no file changed'
        type: boolean
        default: false

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # state = last file fingerprint + last roster snapshot (used for the "what changed" report)
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dashboard-state-${{ github.run_id }}
          restore-keys: dashboard-state-

      - name: Fetch newest Excel files from SharePoint
        id: fetch
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          GOALS_SITE_URL: ${{ vars.GOALS_SITE_URL }}
          GOALS_FOLDER: ${{ vars.GOALS_FOLDER }}
          EMP_SITE_URL: ${{ vars.EMP_SITE_URL }}
          EMP_FOLDER: ${{ vars.EMP_FOLDER }}
          EMP_FILE: ${{ vars.EMP_FILE }}
          FORCE: ${{ (inputs.force || github.event_name == 'push') && 'true' || 'false' }}
        run: |
          python fetch_graph.py > fetch_out.txt
          cat fetch_out.txt >> "$GITHUB_OUTPUT"
      - name: Build dashboards
        if: steps.fetch.outputs.changed == 'true'
        env:
          SP_HOST: ${{ vars.SHAREPOINT_ORIGIN }}
        run: |
          GOALS=$(ls inputs/GoalsExport_*.xlsx | head -n 1)
          python build.py --goals "$GOALS" --emps inputs/employees.xlsx --access inputs/access.xlsx --out site \
            --frame-ancestors "${SP_HOST:-https://*.sharepoint.com}"
          cat report/roster_changes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Azure Static Web Apps
        if: steps.fetch.outputs.changed == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: api
          skip_app_build: true

      - name: Keep the roster report (private, 30 days)
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roster-changes
          path: report/roster_changes.md
          retention-days: 30

      - name: Save state
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: state
          key: dashboard-state-${{ github.run_id }}
