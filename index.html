<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>Goal Dashboard | Vietnam</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#00112A; --bold:#002855; --brand:#007DBB; --shine:#1FB4FF;
    --light:#C0E7FF; --soft:#F7FCFE; --white:#FFFFFF; --star:#FFAA00;
    --red:#E4572E; --green:#1E9E6B; --yellow:#E6A800;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Manrope',sans-serif; background:var(--soft); color:var(--dark); -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Syne',sans-serif; margin:0;}
  header.top{background:linear-gradient(120deg, var(--dark) 0%, var(--bold) 100%); color:var(--white); padding:28px 32px 22px; position:sticky; top:0; z-index:50;}
  header.top h1{font-size:26px; font-weight:700; letter-spacing:0.2px;}
  header.top p{margin:6px 0 0; color:var(--light); font-size:13px; font-weight:500;}
  nav.tabs{display:flex; gap:4px; margin-top:18px; overflow-x:auto; padding-bottom:2px;}
  nav.tabs button{background:transparent; border:none; color:var(--light); font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; padding:10px 16px; border-radius:8px 8px 0 0; cursor:pointer; white-space:nowrap; transition:all .15s ease; letter-spacing:0.2px;}
  nav.tabs button:hover{background:rgba(255,255,255,0.08); color:var(--white);}
  nav.tabs button.active{background:var(--soft); color:var(--dark);}
  main{max-width:1320px; margin:0 auto; padding:28px 32px 80px;}
  section.panel{display:none;}
  section.panel.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .kpi-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:26px;}
  .kpi-card{background:var(--white); border-radius:12px; padding:18px 18px 16px; border:1px solid var(--light); box-shadow:0 1px 3px rgba(0,17,42,0.06);}
  .kpi-card .label{font-size:11.5px; font-weight:700; color:var(--brand); text-transform:uppercase; letter-spacing:0.4px;}
  .kpi-card .value{font-family:'Syne',sans-serif; font-size:30px; font-weight:700; color:var(--dark); margin-top:6px;}
  .kpi-card .sub{font-size:11.5px; color:#5A6B7A; margin-top:4px;}

  .card{background:var(--white); border-radius:12px; padding:20px 22px; margin-bottom:22px; border:1px solid var(--light); box-shadow:0 1px 3px rgba(0,17,42,0.06);}
  .card h2{font-size:17px; margin-bottom:2px;}
  .card .card-sub{font-size:12.5px; color:#5A6B7A; margin-bottom:14px;}

  .scale-legend{display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:11.5px; color:#5A6B7A; margin-bottom:14px; padding:8px 12px; background:var(--soft); border-radius:8px; border:1px solid var(--light);}
  .scale-legend .scale-title{font-weight:800; color:var(--dark); margin-right:2px;}
  .scale-legend .scale-item{display:flex; align-items:center; gap:5px;}
  .scale-legend .scale-chip{display:inline-block; width:12px; height:12px; border-radius:50%; flex-shrink:0;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{background:var(--brand); color:var(--white); text-align:left; padding:9px 10px; font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:0.3px; position:sticky; top:0; white-space:nowrap;}
  thead th.num, td.num{text-align:right;}
  thead th.band{border-bottom:4px solid var(--c);}
  tbody td{padding:8px 10px; border-bottom:1px solid var(--soft);}
  tbody tr.click{cursor:pointer;}
  tbody tr:hover{background:var(--soft);}
  tbody tr.total td{font-weight:800; background:#EAF6FD; border-top:2px solid var(--light);}
  td.zero{color:#B6C0CA;}
  td.sub-name{font-size:11px; color:#5A6B7A; font-weight:500;}
  .pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap;}
  .pill.done{background:#E3F6ED; color:var(--green);}
  .pill.prog{background:#E1F3FC; color:var(--brand);}
  .pill.draft{background:#F0F0F0; color:#666;}
  .heat{color:var(--white); font-weight:700; text-align:center; border-radius:5px; padding:3px 8px; display:inline-block; min-width:56px;}
  .band-tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; white-space:nowrap;}
  .band-tag i{width:10px; height:10px; border-radius:50%; background:var(--c); display:inline-block;}

  .table-scroll{max-height:560px; overflow:auto; border:1px solid var(--soft); border-radius:8px;}
  .search-row{display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; align-items:center;}
  .search-row input, .search-row select{padding:8px 12px; border:1px solid var(--light); border-radius:8px; font-family:'Manrope',sans-serif; font-size:13px; background:var(--soft); color:var(--dark);}
  .search-row input{flex:1; min-width:200px;}
  .search-row .count{margin-left:auto; font-size:12px; color:#5A6B7A;}
  th[data-k]{cursor:pointer;}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,17,42,0.55); z-index:200; align-items:center; justify-content:center; padding:24px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--white); border-radius:14px; max-width:980px; width:100%; max-height:86vh; overflow:auto; padding:24px 26px; box-shadow:0 12px 40px rgba(0,17,42,0.3);}
  .modal-box h2{font-size:20px; margin-bottom:4px;}
  .modal-box .modal-sub{font-size:12.5px; color:#5A6B7A; margin-bottom:14px;}
  .modal-close{float:right; background:var(--soft); border:none; border-radius:8px; width:30px; height:30px; font-size:16px; cursor:pointer; color:var(--dark); font-weight:700;}
  .modal-close:hover{background:var(--light);}
  .mini-kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:16px;}
  .mini-kpis>div{background:var(--soft); border:1px solid var(--light); border-radius:10px; padding:10px 12px;}
  .mini-kpis .l{font-size:10.5px; font-weight:700; color:var(--brand); text-transform:uppercase; letter-spacing:0.3px;}
  .mini-kpis .v{font-family:'Syne',sans-serif; font-size:20px; font-weight:700; margin-top:2px;}
  .mini-kpis .s{font-size:11px; color:#5A6B7A;}
  .filters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; align-items:center;}
  .filters .f-title{font-weight:800; font-size:12px; margin-right:4px;}
  .fbtn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--light); background:var(--white); border-radius:20px; padding:4px 11px; font-family:'Manrope',sans-serif; font-size:12px; font-weight:700; color:var(--dark); cursor:pointer;}
  .fbtn i{width:10px; height:10px; border-radius:50%; background:var(--c); display:inline-block;}
  .fbtn.active{background:var(--dark); color:var(--white); border-color:var(--dark);}
  .fbtn.zero{opacity:.45;}
  tr.goal-row{cursor:pointer;}
  tr.goal-row td:first-child::before{content:"▸"; color:var(--brand); margin-right:6px; display:inline-block; transition:transform .12s;}
  tr.goal-row.open td:first-child::before{transform:rotate(90deg);}
  tr.kr-row td{background:var(--soft); font-size:12.5px; padding-top:6px; padding-bottom:6px;}
  tr.kr-row td:first-child{padding-left:34px; white-space:pre-line;}
  tr.kr-head td{background:var(--soft); font-size:11px; font-weight:800; color:var(--brand); text-transform:uppercase; letter-spacing:0.3px; padding-left:34px;}
  .empty{padding:18px; color:#5A6B7A; font-size:13px;}

  footer{text-align:center; padding:24px; font-size:11.5px; color:#8A96A3;}
  @media (max-width:900px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .mini-kpis{grid-template-columns:repeat(2,1fr);}
    main{padding:20px 16px 60px;}
    header.top{padding:20px 16px;}
  }

  /* ===== Department explorer ===== */
  .dx{display:grid; grid-template-columns:290px 1fr; gap:22px; align-items:start;}
  .rail{position:sticky; top:170px; max-height:calc(100vh - 190px); overflow:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px;}
  .rail-title{font-size:11px; font-weight:800; color:var(--brand); text-transform:uppercase; letter-spacing:.5px; margin:0 2px 2px;}
  .ritem{background:var(--white); border:1px solid var(--light); border-left:5px solid var(--c,var(--brand)); border-radius:10px; padding:10px 12px; cursor:pointer; text-align:left; font-family:'Manrope',sans-serif; color:var(--dark); transition:all .15s ease;}
  .ritem:hover{transform:translateX(2px); box-shadow:0 3px 10px rgba(0,17,42,.1);}
  .ritem.active{background:var(--dark); color:var(--white); border-color:var(--dark); border-left-color:var(--shine);}
  .ritem .rn{font-weight:800; font-size:13px; line-height:1.25;}
  .ritem .rc{font-size:10.5px; font-weight:700; opacity:.65; letter-spacing:.3px;}
  .ritem .rm{display:flex; justify-content:space-between; font-size:11px; margin-top:5px; opacity:.8;}
  .ritem .rbar{height:4px; border-radius:4px; background:rgba(0,125,187,.15); margin-top:6px; overflow:hidden;}
  .ritem .rbar i{display:block; height:100%; border-radius:4px; background:var(--c,var(--brand));}
  .ritem.all{background:linear-gradient(120deg,var(--brand),var(--shine)); color:#fff; border-color:transparent;}
  .ritem.all.active{background:var(--dark);}

  .hero{background:linear-gradient(120deg,var(--dark) 0%,var(--bold) 70%,var(--brand) 140%); color:#fff; border-radius:16px; padding:24px 28px; display:flex; gap:24px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:18px; position:relative; overflow:hidden;}
  .hero::after{content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle,rgba(31,180,255,.35),transparent 70%);}
  .hero .code{display:inline-block; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); border-radius:20px; padding:3px 12px; font-size:12px; font-weight:800; letter-spacing:.6px; color:var(--light);}
  .hero h2{font-size:30px; margin:10px 0 6px; line-height:1.1;}
  .hero .meta{display:flex; gap:22px; flex-wrap:wrap; color:var(--light); font-size:13px; font-weight:600;}
  .hero .meta b{color:#fff; font-family:'Syne',sans-serif; font-size:20px; margin-right:4px;}
  .hero .ringbox{text-align:center; position:relative; z-index:1;}
  .hero .ringbox small{display:block; color:var(--light); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}

  .dgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  .stat{background:var(--white); border:1px solid var(--light); border-radius:12px; padding:14px 16px; position:relative; overflow:hidden;}
  .stat::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c,var(--brand));}
  .stat .l{font-size:11px; font-weight:800; color:var(--brand); text-transform:uppercase; letter-spacing:.4px;}
  .stat .v{font-family:'Syne',sans-serif; font-size:28px; font-weight:700; margin-top:4px;}
  .stat .s{font-size:11.5px; color:#5A6B7A;}

  .two{display:grid; grid-template-columns:1fr 1.5fr; gap:18px; margin-bottom:18px;}
  .two .card{margin:0;}
  .donutwrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .dlegend{display:flex; flex-direction:column; gap:8px; font-size:12.5px; font-weight:600;}
  .dlegend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:7px; vertical-align:-1px;}
  .dlegend b{margin-left:6px;}
  .hbar{display:grid; grid-template-columns:96px 1fr 44px; gap:10px; align-items:center; font-size:12px; font-weight:700; margin:7px 0;}
  .hbar .track{background:var(--soft); border-radius:6px; height:20px; overflow:hidden; border:1px solid var(--light);}
  .hbar .track i{display:block; height:100%; border-radius:5px; min-width:2px;}
  .hbar .n{text-align:right; font-family:'Syne',sans-serif;}

  .hl{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px;}
  .hl .card{margin:0;}
  .hl h3{font-size:14px; margin-bottom:10px;}
  .hl.good h3{color:var(--green);} 
  .rankrow{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--light); cursor:pointer; font-size:13px;}
  .rankrow:last-child{border-bottom:none;}
  .rankrow:hover b{color:var(--brand);}
  .rankrow .pos{width:22px; height:22px; border-radius:50%; background:var(--light); color:var(--bold); font-weight:800; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .rankrow .nm{flex:1; font-weight:700;}
  .rankrow .gl{font-size:11px; color:#5A6B7A;}

  .sec-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin:6px 0 12px;}
  .sec-head h3{font-size:17px;}
  .sec-head select{padding:7px 11px; border:1px solid var(--light); border-radius:8px; font-family:'Manrope',sans-serif; font-size:12.5px; background:var(--white); color:var(--dark);}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .ecard,.dcard{background:var(--white); border:1px solid var(--light); border-radius:12px; padding:14px 15px; cursor:pointer; transition:all .15s ease; border-top:4px solid var(--c,var(--brand));}
  .ecard:hover,.dcard:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,17,42,.12);}
  .ecard .top{display:flex; gap:10px; align-items:center;}
  .avatar{width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--shine)); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .ecard .en{font-weight:800; font-size:13.5px; line-height:1.2;}
  .ecard .eg{font-size:11.5px; color:#5A6B7A;}
  .ecard .pct{font-family:'Syne',sans-serif; font-size:22px; font-weight:700; margin:10px 0 6px; display:flex; justify-content:space-between; align-items:baseline;}
  .ecard .pct small{font-family:'Manrope',sans-serif; font-size:11px; font-weight:600; color:#5A6B7A;}
  .stack{display:flex; height:8px; border-radius:6px; overflow:hidden; background:var(--soft);}
  .stack span{display:block; height:100%;}
  .ecard .chips{display:flex; gap:5px; margin-top:9px; flex-wrap:wrap;}
  .dcard .dn{font-weight:800; font-size:14px; line-height:1.25; margin:6px 0 2px;}
  .dcard .dm{font-size:11.5px; color:#5A6B7A; margin-bottom:8px;}
  .dcard .pct{font-family:'Syne',sans-serif; font-size:24px; font-weight:700; margin-bottom:6px;}
  @media (max-width:1000px){
    .dx{grid-template-columns:1fr;}
    .rail{position:static; flex-direction:row; overflow-x:auto; max-height:none; padding-bottom:8px;}
    .rail-title{display:none;}
    .ritem{min-width:200px; flex-shrink:0;}
    .dgrid{grid-template-columns:repeat(2,1fr);}
    .two,.hl{grid-template-columns:1fr;}
  }
  .supgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-bottom:8px;}
  .supcard{background:var(--white); border:1px solid var(--light); border-radius:12px; padding:13px 15px; cursor:pointer; text-align:left; font-family:'Manrope',sans-serif; color:var(--dark); border-left:5px solid var(--c,var(--brand)); transition:all .15s ease;}
  .supcard:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,17,42,.1);}
  .supcard.active{background:var(--dark); color:#fff; border-color:var(--dark); border-left-color:var(--shine);}
  .supcard .sn{font-weight:800; font-size:14px;}
  .supcard .st{font-size:11px; opacity:.7; margin-bottom:6px;}
  .supcard .sm{display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:7px;}
  .supcard .sm b{font-family:'Syne',sans-serif; font-size:17px;}
  .team{margin:6px 0 22px;}
  .team-head{display:flex; align-items:center; gap:10px; margin:14px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--light);}
  .team-head h4{font-family:'Syne',sans-serif; font-size:15px; margin:0;}
  .team-head .tm{font-size:12px; color:#5A6B7A;}
  .team-head .ts{margin-left:auto; font-weight:800; font-size:13px;}
  .ecard .etitle{font-size:11px; color:#5A6B7A; margin-top:1px;}


  th.go,td.go{width:28px; padding-left:0!important; padding-right:10px!important; text-align:center;}
  td.go{color:var(--brand); font-size:22px; font-weight:700; line-height:1; opacity:.55; transition:opacity .12s, transform .12s;}
  tr.click:hover td.go{opacity:1; transform:translateX(2px);}

  .tgo{font-size:12px; font-weight:800; color:var(--brand); text-align:right; white-space:nowrap;} .trow:not(.thead):hover .tgo{text-decoration:underline;}

  .mgo{display:flex; justify-content:space-between; align-items:center; margin-top:11px; padding-top:9px; border-top:1px dashed var(--light); font-size:12px; font-weight:800; color:var(--brand);}
  .mgo .arr{font-size:13px; transition:transform .12s;} .mcard:hover .mgo .arr{transform:translateX(2px);} .mcard:hover .mgo span:first-child{text-decoration:underline;}
  .mcard.active .mgo{border-top-color:rgba(255,255,255,.25); color:var(--light);}
  .mcard.hcard .stack{margin-top:auto;} .mcard.hcard .mst{margin-bottom:0;}

  .hbar.head{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:#5A6B7A; font-weight:800; margin:2px 0 0;} .hbar.head .n,.hbar.head .pc{font-family:'Manrope',sans-serif; font-size:10.5px; font-weight:800; color:#5A6B7A;}

  .dgrid.three{grid-template-columns:repeat(3,1fr);} @media (max-width:600px){.dgrid.three{grid-template-columns:1fr;}}
  .info{display:inline-flex; width:15px; height:15px; border-radius:50%; background:rgba(0,125,187,.16); color:var(--brand); font:800 10px 'Manrope',sans-serif; font-style:normal !important; align-items:center; justify-content:center; margin-left:6px; cursor:help; vertical-align:middle; text-transform:none; letter-spacing:0;}
  .info:hover,.info:focus{background:var(--brand); color:#fff; outline:none;}
  .hero .info,.mcard.active .info,th .info{background:rgba(255,255,255,.22); color:#fff;} th .info:hover{background:#fff; color:var(--brand);}
  .tip{position:fixed; z-index:500; width:300px; background:#fff; color:var(--dark); border:1px solid var(--light); border-radius:12px; box-shadow:0 10px 30px rgba(0,17,42,.22); padding:13px 15px; font-size:12px; line-height:1.5; font-weight:500; text-transform:none; letter-spacing:0; text-align:left; display:none;}
  .tip b{font-family:'Syne',sans-serif; font-size:13px;} .tip ol{margin:7px 0 9px; padding-left:18px;} .tip li{margin-bottom:3px;}
  .tip .ex{background:var(--soft); border:1px dashed var(--light); border-radius:8px; padding:6px 9px; font-weight:700; margin-bottom:7px;} .tip .fn{color:#5A6B7A; font-size:11px;}

  .nmrow{display:flex; align-items:center;} .nmrow > b{flex:0 0 126px; white-space:nowrap;} #emp-table td:first-child .rtag{margin:0 !important;}

  #emp-table td:nth-child(2),#emp-table td:nth-child(3){white-space:nowrap;}

  #legend-emp .scale-item svg,#legend-emp .scale-item .scale-chip{flex:none;} #legend-emp .scale-item{gap:7px;}

  #legend-emp{gap:0 !important; padding:4px 14px !important;}
  #legend-emp .lgrow{display:grid !important; grid-template-columns:150px repeat(3,minmax(0,1fr)); align-items:center; gap:0 !important; padding:8px 0; border-top:1px dashed #B9DCEF;}
  #legend-emp .lgrow:first-child{border-top:none;}
  #legend-emp .lgrow .scale-title{flex:none; margin:0;}
  #legend-emp .lgrow .scale-item,#legend-emp .lgrow .scale-item.wide{flex:none; margin:0; white-space:nowrap;}
  @media (max-width:760px){ #legend-emp .lgrow{display:flex !important; flex-wrap:wrap; gap:6px 16px !important;} #legend-emp .lgrow .scale-title{flex:0 0 100%;} }

  #modal-content tbody tr.goal-row td:nth-child(2){white-space:nowrap;}

  .gflag{display:inline-flex; vertical-align:middle; margin-left:7px;}

  .rflag{display:inline-flex; align-items:center; gap:2px; width:34px; margin-right:6px; vertical-align:middle;} .rflag span{display:inline-flex;} .tri{display:block;}
  .rev-note{display:flex; align-items:center; gap:18px; flex-wrap:wrap; font-size:12.5px; font-weight:700; color:var(--dark); background:var(--soft); border:1px solid var(--light); border-radius:8px; padding:7px 12px; margin-bottom:12px;}
  .rev-note .rv{display:inline-flex; align-items:center; gap:7px;}
  .lgrow .scale-item.wide{flex:0 0 auto; margin-right:22px; gap:7px;}

  .rdot{display:inline-block; width:9px; height:9px; border-radius:50%; background:#E6A800; margin-right:7px; vertical-align:middle; flex:0 0 9px;} .rdot.none{background:transparent;}
  .lgrow .scale-item.wide{flex:1 1 auto;} .lgrow .rdot{width:12px; height:12px; flex:0 0 12px; margin-right:0;}

<div id="gate" style="position:fixed;inset:0;background:linear-gradient(160deg,#00112A,#002855);z-index:9999;display:grid;place-items:center;font-family:Manrope,Segoe UI,Arial,sans-serif;padding:16px">

  </div>
</div>
<script type="text/plain" id="app-js">const OTHER='Other Reporting Lines';
const BRAND="#007DBB", RED="#E4572E", GREEN="#1E9E6B", GREY="#9AA5B1";
const BANDS = [
  {label:"Under 25%",                 short:"<25%",        color:RED,       ink:"#fff"},
  {label:"25% – <50%",                short:"25–<50%",     color:"#BFE0F3", ink:"#00112A"},
  {label:"50% – <75%",                short:"50–<75%",     color:"#7DBFE4", ink:"#00112A"},
  {label:"75% – 100%",                short:"75–100%",     color:BRAND,     ink:"#fff"},
  {label:"Out of range (>100% or <0%)", short:">100% / <0%", color:"#002855", ink:"#fff"}
];
const bandIdx = p => (p<0 || p>100) ? 4 : p<25 ? 0 : p<50 ? 1 : p<75 ? 2 : 3;
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN = v => v.toLocaleString('en-US');
const r1 = v => Math.round(v*10)/10;
const fmtP = v => r1(v).toFixed(1)+'%';
const fmtG = p => Number(p.toFixed(2)).toLocaleString('en-US')+'%';
const cap = p => Math.max(0, Math.min(100, p));
const pctOf = (v,n) => n ? fmtP(v/n*100) : '0.0%';
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;

// ---- build data ----
const EMPS = DATA.emps.map((e,i)=>({id:e[0], name:e[1], dept:e[2], head:ORG[i][0], sup:ORG[i][1], title:ORG[i][2], supTitle:ORG[i][3], resigned:!!ORG[i][4], goals:[], idx:i}));
DATA.goals.forEach(g=>{ EMPS[g[0]].goals.push({id:g[1], name:g[2], status:g[3], p:g[4], krs:g[5], fam:g[6]==null?null:g[6], contrib:g[7]||''}); });
function agg(goals){
  const a={n:goals.length, done:0, prog:0, draft:0, sum:0, sumCap:0, b:[0,0,0,0,0]};
  goals.forEach(g=>{
    a.sum+=g.p; a.sumCap+=cap(g.p); a.b[bandIdx(g.p)]++;
    if(g.status==='Completed') a.done++; else if(g.status==='In Progress') a.prog++; else if(g.status==='Draft') a.draft++;
  });
  a.avg = a.n ? r1(a.sum/a.n) : 0; a.avgCap = a.n ? r1(a.sumCap/a.n) : 0;
  return a;
}
// status vs % check: marked Completed below 100%, or reached 100% but not marked Completed
const FLAG_A='#E6A800', FLAG_B='#1FB4FF';   // A: marked Completed below 100% · B: reached 100% but not Completed
const triIcon = (c,sz=15) => `<svg class="tri" width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 22.4 21H1.6z" fill="${c}" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><rect x="11" y="9" width="2" height="6.2" rx="1" fill="#fff"/><circle cx="12" cy="17.6" r="1.25" fill="#fff"/></svg>`;
const flagOf = g => g.status==='Completed' ? (g.p<100 ? 'A' : null) : (g.p>=100 ? 'B' : null);
const flagText0 = null;
const flagText = g => flagOf(g)==='A' ? `Marked Completed at ${fmtG(g.p)}` : flagOf(g)==='B' ? `Reached ${fmtG(g.p)} but still ${g.status||'not Completed'}` : '';
const goalFlag = g => { const f=flagOf(g); return f ? `<span class="gflag" title="${esc(flagText(g))}">${triIcon(f==='A'?FLAG_A:FLAG_B,14)}</span>` : ''; };
EMPS.forEach(e=>{ e.a = agg(e.goals); e.fA=e.goals.filter(g=>flagOf(g)==='A').length; e.fB=e.goals.filter(g=>flagOf(g)==='B').length; e.flagged=e.fA+e.fB; });
const ALL_GOALS = EMPS.flatMap(e=>e.goals);
const ALL = agg(ALL_GOALS);
const HEAD_ORDER = ['Amy Nguyen','Toan Nguyen','Ping Guo','Thanh Thai','Anh Nguyen',OTHER];
const HEADS_M = {};
EMPS.forEach(e=>{ (HEADS_M[e.head]=HEADS_M[e.head]||{name:e.head, emps:[], goals:[]}); HEADS_M[e.head].emps.push(e); HEADS_M[e.head].goals.push(...e.goals); });
const leaderSet = emps => { const nm=new Set(emps.map(e=>e.name)); const H=new Set(emps.filter(e=>e.sup==='(Dept Head)').map(e=>e.name)); return new Set(emps.filter(e=>e.sup!=='(Dept Head)').map(e=>e.sup).filter(n=>nm.has(n)&&!H.has(n))); };
const empCount = emps => { const L=leaderSet(emps); return emps.filter(e=>e.sup!=='(Dept Head)' && !L.has(e.name)).length; };
const teamTxt = emps => plural(empCount(emps),'employee')+' · '+plural(leaderSet(emps).size,'leader');
const supCount = emps => leaderSet(emps).size;
const HEAD_LIST = HEAD_ORDER.filter(n=>HEADS_M[n]).map(n=>({name:n, emps:HEADS_M[n].emps, nSup:supCount(HEADS_M[n].emps), nEmp:empCount(HEADS_M[n].emps), a:agg(HEADS_M[n].goals)}));
const SINGLE = HEAD_LIST.length===1;
const headSub = n => n===OTHER ? 'Reports outside the VN leadership team' : (HEAD_TITLE[n]||'');

// ---- header text ----
const ttl = SINGLE ? `${HEAD_LIST[0].name}'s Team` : 'Vietnam';
document.getElementById('hdr-title').textContent = 'Goal Dashboard — ' + ttl;
document.getElementById('hdr-sub').textContent = SINGLE
  ? `${headSub(HEAD_LIST[0].name)?headSub(HEAD_LIST[0].name)+' · ':''}${EMPS.length} employees · ${fmtN(ALL.n)} goals`
  : `${EMPS.length} employees · ${fmtN(ALL.n)} goals · Vietnam`;
document.title = 'Goal Dashboard | ' + ttl;
if (typeof META!=='undefined' && META.updated) document.getElementById('hdr-upd').textContent = 'Data updated: ' + META.updated;
document.getElementById('ftr').textContent = SINGLE
  ? `Confidential — contains goal data for ${HEAD_LIST[0].name}'s team only · Built for Vietnam People Team review`
  : 'Built for Vietnam People Team review · Data from GoalsExport · Totals match the system; people who are no longer active are excluded from rankings';

// ---- full screen ----
const fsBtn = document.getElementById('fs-btn');
function fsOn(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function fsLabel(){ fsBtn.textContent = fsOn() ? '⤢ Exit full screen' : '⛶ Full screen'; }
fsBtn.addEventListener('click', ()=>{
  const el=document.documentElement;
  try{
    if(fsOn()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
  }catch(e){ fsBtn.title='Full screen is not available in this viewer — open the file in a browser'; }
});
document.addEventListener('fullscreenchange', fsLabel); document.addEventListener('webkitfullscreenchange', fsLabel);
fsLabel();

// ---- "how is it calculated" popup ----
function tipHtml(a,scope){
  return `<b>How Avg completion is calculated</b><ol><li>Take the % of every goal in this view (Completed, In Progress and Draft).</li><li>Limit each goal to 0–100% (for example -825% counts as 0 and 744% counts as 100).</li><li>Average across goals: total ÷ number of goals. It is not an average of people, so people with more goals weigh more.</li></ol>${a?`<div class="ex">Example – ${esc(scope)}: ${fmtN(Math.round(a.sumCap))} ÷ ${fmtN(a.n)} goals = ${fmtP(a.avgCap)}</div>`:''}<div class="fn">Goals that are not yet due count at their current %. People who are no longer active are included so totals match the system.</div>`;
}
const info = (a,scope) => `<i class="info" tabindex="0" data-tip="${esc(tipHtml(a,scope))}">i</i>`;
(function(){
  const tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip); let pinned=null;
  const show=el=>{ tip.innerHTML=el.dataset.tip; tip.style.display='block'; const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
    let l=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2)), t=r.bottom+8; if(t+h>innerHeight-8) t=Math.max(8,r.top-h-8); tip.style.left=l+'px'; tip.style.top=t+'px'; };
  const hide=()=>{ tip.style.display='none'; pinned=null; };
  document.addEventListener('mouseover',e=>{ const i=e.target.closest('.info'); if(i&&!pinned) show(i); });
  document.addEventListener('mouseout',e=>{ const i=e.target.closest('.info'); if(i&&!pinned) tip.style.display='none'; });
  document.addEventListener('click',e=>{ const i=e.target.closest('.info'); if(i){ e.stopPropagation(); e.preventDefault(); if(pinned===i){ hide(); } else { pinned=i; show(i); } return; } if(!e.target.closest('.tip')) hide(); },true);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); });
  document.addEventListener('scroll',()=>{ if(!pinned) tip.style.display='none'; },true);
})();

// ---- shared pieces ----
const colOf = p => p<25 ? RED : BRAND;
function statusBar(a){
  const seg=[[a.done,GREEN,'Completed'],[a.prog,BRAND,'In Progress'],[a.draft,GREY,'Draft']];
  return '<div class="stack">'+seg.map(s=>s[0]?`<span style="flex:${s[0]};background:${s[1]}" title="${s[2]}: ${s[0]}"></span>`:'').join('')+'</div>';
}
function statTriplet(a){
  return `<div class="trip"><div><i style="background:${GREEN}"></i>Completed<b>${a.done}</b><span>${pctOf(a.done,a.n)}</span></div><div><i style="background:${BRAND}"></i>In Progress<b>${a.prog}</b><span>${pctOf(a.prog,a.n)}</span></div><div><i style="background:${GREY}"></i>Draft<b>${a.draft}</b><span>${pctOf(a.draft,a.n)}</span></div></div>`;
}
function ring(pct){
  const r=44, c=2*Math.PI*r, off=c*(1-cap(pct)/100);
  return `<svg viewBox="0 0 100 100" width="120" height="120"><circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="9"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="#1FB4FF" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-family="Syne,sans-serif" font-size="22" font-weight="700" fill="#fff">${Math.round(pct)}%</text></svg>`;
}
function boxes(a){
  const items=[['Completed',a.done,GREEN],['In Progress',a.prog,BRAND],['Draft',a.draft,GREY]];
  return `<div class="sec-head" style="margin-top:4px"><h3>Overall Goal Status</h3></div><div class="dgrid three">`+items.map(x=>`<div class="stat" style="--c:${x[2]}"><div class="l">${x[0]}</div><div class="v">${fmtN(x[1])}<small>${pctOf(x[1],a.n)}</small></div><div class="s">of ${fmtN(a.n)} goals</div></div>`).join('')+'</div>';
}
function bandChart(a){
  const mx=Math.max(1,...a.b);
  return `<div class="hbar head"><span></span><span></span><span class="n">Goals</span><span class="pc">Share</span></div>`+BANDS.map((b,i)=>`<div class="hbar"><span class="bl">${b.label}</span><div class="track"><i style="width:${a.b[i]/mx*100}%;background:${b.color}"></i></div><span class="n">${a.b[i]}</span><span class="pc">${pctOf(a.b[i],a.n)}</span></div>`).join('')
   + `<div class="note">“Out of range” = progress above 100% or below 0%. These are usually calculation errors — listed here only so they can be reviewed.</div>`;
}
const cRatio = e => e.a.n ? e.a.done/e.a.n : 0;
function rankList(list,good){
  return list.map((e,i)=>`<div class="rankrow" data-ei="${e.idx}"><span class="pos">${i+1}</span><span class="nm"><b>${esc(e.name)}</b><div class="gl">${esc(e.sup==='(Dept Head)'?'Dept Head':e.sup)} · ${e.a.done}/${e.a.n} goals completed</div></span><span class="pcv" style="color:${good?GREEN:RED}">${pctOf(e.a.done,e.a.n)}</span></div>`).join('');
}
function rankings(emps){
  const withG=emps.filter(e=>e.a.n>0 && !e.resigned);
  const k=Math.min(5,Math.floor(withG.length/2)); if(k<1) return '';
  const hi=withG.filter(e=>e.a.done>0).sort((x,y)=>cRatio(y)-cRatio(x)||y.a.done-x.a.done||y.a.n-x.a.n||x.name.localeCompare(y.name)).slice(0,k);
  const lo=withG.filter(e=>!hi.includes(e)).sort((x,y)=>cRatio(x)-cRatio(y)||x.a.avgCap-y.a.avgCap||y.a.n-x.a.n||x.name.localeCompare(y.name)).slice(0,k);
  return `<div class="hl"><div class="card"><h3 style="color:${GREEN}">▲ ${hi.length?'Top '+hi.length:'Top'} — highest completion</h3><div class="card-sub">Completed goals ÷ total goals for each person</div>${hi.length?rankList(hi,true):'<div class="empty">No completed goals yet.</div>'}</div><div class="card"><h3 style="color:${RED}">▼ Top ${lo.length} — need support</h3><div class="card-sub">Lowest Completed ÷ total goals, among active employees who have goals</div>${rankList(lo,false)}</div></div>`;
}

// ---- Dept Head tab ----
let CURD = SINGLE ? HEAD_LIST[0].name : '__ALL__', MSEL = null;
function renderRail(){
  const rail=document.getElementById('dept-rail');
  if(SINGLE){ rail.style.display='none'; document.querySelector('.dx').style.gridTemplateColumns='1fr'; return; }
  const all=`<button class="ritem all ${CURD==='__ALL__'?'active':''}" data-d="__ALL__"><div class="rn">All Vietnam</div><div class="rm"><span>${EMPS.length} employees</span><span>${fmtN(ALL.n)} goals</span></div></button>`;
  const items=HEAD_LIST.map(h=>`<button class="ritem ${CURD===h.name?'active':''}" data-d="${esc(h.name)}"><div class="rc">DEPT HEAD</div><div class="rn">${esc(h.name)}</div><div class="rc" style="font-weight:500;letter-spacing:0">${esc(headSub(h.name))}</div><div class="rm"><span>${h.nEmp} emp · ${h.nSup} leaders · ${h.a.n} goals</span><span><b>${fmtP(h.a.avgCap)}</b></span></div></button>`).join('');
  rail.innerHTML='<div class="rail-title">Select Dept Head</div>'+all+items;
}
function teamCard(g,own){
  const a=g.a;
  return `<button class="tcard ${own?'own':''}" data-s="${esc(g.name)}" data-own="${own?1:0}"><div class="tn">${esc(own?g.name+' (own goals)':g.name)}</div><div class="tt">${esc(g.title)}${own?'':(g.name===CURD?' · Dept Head’s direct reports':(g.up&&g.up!==g.name?' · Reports to '+esc(g.up):''))}</div><div class="tm">${plural(g.emps.length,'person').replace('persons','people')} · ${plural(a.n,'goal')}</div>${statusBar(a)}${statTriplet(a)}<div class="tf"><span>Under 25%: <b>${a.b[0]}</b></span><span>Avg completion: <b style="color:${colOf(a.avgCap)}">${fmtP(a.avgCap)}</b></span></div></button>`;
}
function headCard(h){
  const a=h.a; const sub=h.name===OTHER?'Outside the VN leadership team':(headSub(h.name)||'Dept Head');
  return `<button class="mcard hcard" data-d="${esc(h.name)}"><div class="mn">${esc(h.name)}</div><div class="mt">${esc(sub)}</div><div class="mm">${h.nEmp} employees · ${plural(h.nSup,'leader')} · ${plural(a.n,'goal')}</div><div class="mavg"><b style="color:${colOf(a.avgCap)}">${fmtP(a.avgCap)}</b><span>avg completion${info(a,h.name)}</span></div>${statusBar(a)}<div class="mst">${a.done} Completed · ${a.prog} In Progress · ${a.draft} Draft</div><div class="mgo"><span>Open dashboard</span><span class="arr">→</span></div></button>`;
}
function renderDept(){
  renderRail();
  const isAll = CURD==='__ALL__';
  const hh = isAll?null:HEAD_LIST.find(x=>x.name===CURD);
  const emps = isAll?EMPS:hh.emps;
  const a = isAll?ALL:hh.a;
  const title = isAll?'All Vietnam':CURD;
  const badge = isAll?'VIETNAM':(CURD===OTHER?'OTHER':'DEPT HEAD');
  const sub = isAll?'':headSub(CURD);
  const nSup = supCount(emps);
  let html=`
  <div class="hero"><div style="position:relative;z-index:1"><span class="code">${badge}</span><h2>${esc(title)}</h2>${sub?`<div class="hsub">${esc(sub)}</div>`:''}<div class="meta"><span><b>${empCount(emps)}</b>employees</span><span><b>${nSup}</b>${nSup===1?'leader':'leaders'}</span><span><b>${fmtN(a.n)}</b>goals</span></div></div><div class="ringbox">${ring(a.avgCap)}<small>Avg completion${info(a,title)}</small><em>Each goal is limited to 0–100% before averaging</em></div></div>
  ${boxes(a)}
  <div class="card"><h2>Goal Completion Range</h2><div class="card-sub">Number of goals in each completion range. The % on the right is the share of the <b>${fmtN(a.n)} goals</b>.</div>${bandChart(a)}</div>
  ${rankings(emps)}`;
  if(isAll){
    html+=`<div class="sec-head"><h3>Dept Heads</h3><span class="hint">Click a Dept Head to open their dashboard</span></div><div class="mgrid hgrid">${HEAD_LIST.map(headCard).join('')}</div>`;
  } else {
    const own = emps.find(e=>e.sup==='(Dept Head)');
    const rest = emps.filter(e=>e!==own);
    const G={}; rest.forEach(e=>{ (G[e.sup]=G[e.sup]||{name:e.sup, title:e.supTitle, emps:[], goals:[]}); G[e.sup].emps.push(e); G[e.sup].goals.push(...e.goals); });
    const dfl = n => n==='No longer active'?'Employee no longer active':CURD===OTHER?'Outside VN org':'Leader';
    const upOf = g => { const x=emps.find(y=>y.name===g.name && (!g.title || y.title===g.title)); return x ? (x.sup==='(Dept Head)'?CURD:x.sup) : null; };
    const UP={}; Object.values(G).forEach(g=>{ UP[g.name]=upOf(g); });
    // build tree: node = leader + their direct team + sub-leaders
    const mk = (name,seen=[]) => {
      const g=G[name]; const kids=Object.values(G).filter(k=>k.name!==name && !seen.includes(k.name) && UP[k.name]===name).map(k=>mk(k.name,seen.concat(name))).sort((x,y)=>y.emps.length-x.emps.length||x.name.localeCompare(y.name));
      const emps_=[...g.emps,...kids.flatMap(k=>k.emps)];
      return {name, title:g.title||dfl(name), direct:g.emps, kids, emps:emps_, a:agg(emps_.flatMap(e=>e.goals)), da:agg(g.goals)};
    };
    const tops=Object.values(G).filter(g=>g.name!==CURD && (UP[g.name]===CURD || !UP[g.name] || !G[UP[g.name]])).map(g=>mk(g.name)).sort((x,y)=>y.emps.length-x.emps.length||x.name.localeCompare(y.name));
    if(MSEL && !tops.find(t=>t.name===MSEL)) MSEL=null;
    const sel=tops.find(t=>t.name===MSEL);
    const headDirect=G[CURD]; 
    const card=(t)=>`<button class="mcard ${MSEL===t.name?'active':''}" data-m="${esc(t.name)}" data-kids="${t.kids.length?1:0}"><div class="mn">${esc(t.name)}</div><div class="mt">${esc(t.title)}</div><div class="mm">${teamTxt(t.emps)} · ${plural(t.a.n,'goal')}</div><div class="mavg"><b style="color:${colOf(t.a.avgCap)}">${fmtP(t.a.avgCap)}</b><span>avg completion${info(t.a,t.name+'’s team')}</span></div>${statusBar(t.a)}<div class="mgo"><span>${t.kids.length?(MSEL===t.name?'Hide teams':`View ${t.kids.length+1} teams`):'View employees'}</span><span class="arr">${t.kids.length?(MSEL===t.name?'▴':'▾'):'→'}</span></div></button>`;
    const smallCard=(label,sub,list,aa,key,ownFlag)=>`<button class="mcard light" data-s="${esc(key)}" data-own="${ownFlag?1:0}"><div class="mn">${esc(label)}</div><div class="mt">${esc(sub)}</div><div class="mm">${ownFlag?'Dept Head':teamTxt(list)} · ${plural(aa.n,'goal')}</div><div class="mavg"><b style="color:${colOf(aa.avgCap)}">${fmtP(aa.avgCap)}</b><span>avg completion${info(aa,label)}</span></div>${statusBar(aa)}<div class="mgo"><span>View employees</span><span class="arr">→</span></div></button>`;
    const trow=(label,sub,list,aa,key,depth)=>`<div class="trow ${depth?'sub':''}" data-s="${esc(key)}" data-own="0" style="--d:${depth}"><div class="tnm"><b>${esc(label)}</b><span>${esc(sub)}</span></div><div class="tpp">${plural(empCount(list),'employee')}<span>${plural(leaderSet(list).size,'leader')} · ${plural(aa.n,'goal')}</span></div><div>${statusBar(aa)}</div><div class="tst"><i style="background:${GREEN}"></i><b>${aa.done}</b><span>${pctOf(aa.done,aa.n)}</span></div><div class="tst"><i style="background:${BRAND}"></i><b>${aa.prog}</b><span>${pctOf(aa.prog,aa.n)}</span></div><div class="tst"><i style="background:${GREY}"></i><b>${aa.draft}</b><span>${pctOf(aa.draft,aa.n)}</span></div><div class="tav" style="color:${colOf(aa.avgCap)}">${fmtP(aa.avgCap)}</div><div class="tgo">View employees →</div></div>`;
    const rowsFor=(n,depth)=>{
      let out='';
      if(n.kids.length) out+=trow(n.name+'’s direct team','Reports directly to '+n.name,n.direct,n.da,n.name,depth);
      n.kids.forEach(k=>{
        if(k.kids.length){ out+=trow(k.name,k.title+' · whole branch',k.emps,k.a,k.name,depth)+rowsFor(k,depth+1); }
        else out+=trow(k.name,k.title,k.emps,k.a,k.name,depth);
      });
      return out;
    };
    const panel=sel?`<div class="mpanel"><div class="mp-head"><div><h3>Teams under ${esc(sel.name)}</h3><div class="mp-sub">${teamTxt(sel.emps)} in total · click a team to open its employees in the Employee tab</div></div><button class="mp-close" data-mclose="1" aria-label="Close">✕</button></div><div class="trow thead"><div>Team</div><div>Size</div><div>Status</div><div>Completed</div><div>In Progress</div><div>Draft</div><div>Avg${info(null,'')}</div><div></div></div>${rowsFor(sel,0)}</div>`:'';
    html+=`<div class="sec-head"><h3>Teams under ${esc(title)}</h3><span class="hint">Click a manager to see the teams under them</span></div><div class="mgrid">${tops.map(card).join('')}${headDirect?smallCard('Direct reports of '+title,'Report straight to the Dept Head',headDirect.emps,agg(headDirect.goals),CURD,false):''}${own?smallCard(title+' (own goals)','Dept Head',[own],own.a,own.name,true):''}</div>${panel}`;
  }
  document.getElementById('dept-detail').innerHTML=html;
}
const goTop=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('dept-rail').addEventListener('click',e=>{ const b=e.target.closest('[data-d]'); if(!b) return; CURD=b.dataset.d; MSEL=null; renderDept(); goTop(); });
document.getElementById('dept-detail').addEventListener('click',e=>{
  if(e.target.closest('[data-mclose]')){ MSEL=null; renderDept(); return; }
  const mc=e.target.closest('.mcard[data-m]'); if(mc){ if(mc.dataset.kids==='1'){ MSEL = MSEL===mc.dataset.m ? null : mc.dataset.m; renderDept(); const p=document.querySelector('.mpanel'); if(p&&MSEL) p.scrollIntoView({behavior:'smooth',block:'nearest'}); } else { openTeam(mc.dataset.m,false); } return; }
  const sc=e.target.closest('[data-s]'); if(sc){ openTeam(sc.dataset.s, sc.dataset.own==='1'); return; }
  const hc=e.target.closest('.tcard[data-d], .mcard[data-d]'); if(hc){ CURD=hc.dataset.d; MSEL=null; renderDept(); goTop(); return; }
  const m=e.target.closest('[data-ei]'); if(m) openEmp(EMPS[+m.dataset.ei]);
});

// ---- Employee tab ----
const COLS = [
  {k:'n', t:'Goals'},
  {k:'avgCap', t:'Avg completion', tip:'Average of the goal % after limiting each goal to 0–100%'}
];
const SEGS=[
  {k:'g0', t:'Under 25%',       tip:'Goals under 25% completion',               color:BANDS[0].color, bg:'#FCEBE5', ink:'#B8401F', f:a=>a.b[0]},
  {k:'g1', t:'25% – 100%',      tip:'Goals from 25% up to 100% completion',     color:'#C9D3DC',      bg:'',        ink:'#5A6B7A', f:a=>a.b[1]+a.b[2]+a.b[3]},
  {k:'g2', t:'Over 100% / <0%', tip:'Goals above 100% or below 0% (check)',     color:BANDS[4].color, bg:'#E6EBF2', ink:'#002855', f:a=>a.b[4]}
];
function headCells(first){
  return '<tr>'+first+COLS.map(c=>`<th class="num" data-k="${c.k}" ${c.tip?`title="${c.tip}"`:''}>${c.t}${c.k==='avgCap'?info(null,''):''}</th>`).join('')
   + SEGS.map(g=>`<th class="num seg" data-k="${g.k}" style="--c:${g.color};" title="${g.tip}">${g.t}</th>`).join('')
   + `<th data-k="done" title="Completed · In Progress · Draft (click to sort by Completed)">Status <span class="sth"><i style="background:${GREEN}"></i>Done<i style="background:${BRAND}"></i>In prog.<i style="background:${GREY}"></i>Draft</span></th><th class="go"></th></tr>`;
}
function statusBarNum(a){
  if(!a.n) return '';
  const seg=[[a.done,GREEN,'Completed'],[a.prog,BRAND,'In Progress'],[a.draft,GREY,'Draft']];
  const tip=seg.map(x=>`${x[2]}: ${x[0]} (${pctOf(x[0],a.n)})`).join(' | ');
  return `<div class="sbar" title="${tip}">`+seg.map(x=>x[0]?`<span style="flex:${x[0]};background:${x[1]}">${x[0]/a.n>=0.12?x[0]:''}</span>`:'').join('')+'</div>';
}
function numCells(a){
  return `<td class="num">${a.n}</td><td class="num"><b>${fmtP(a.avgCap)}</b></td>`
   + SEGS.map(g=>{const v=g.f(a); return v?`<td class="num segc" style="${g.bg?'background:'+g.bg+';':''}color:${g.ink}"><b>${v}</b></td>`:'<td class="num segc zero">–</td>';}).join('')
   + `<td class="stc">${statusBarNum(a)}</td>`;
}
function revDot(e){
  const tA=`${e.fA} marked Completed below 100%`, tB=`${e.fB} reached 100% but not Completed`;
  return `<span class="rflag">${e.fA?`<span title="${tA}">${triIcon(FLAG_A)}</span>`:''}${e.fB?`<span title="${tB}">${triIcon(FLAG_B)}</span>`:''}</span>`;
}
const getVal=(row,k)=> k==='name'?row.name : k==='dept'?row.dept : k==='sup'?row.sup : k[0]==='g'&&k.length===2 ? SEGS[+k[1]].f(row.a) : (k[0]==='b'&&k.length===2)?row.a.b[+k[1]] : row.a[k];
document.getElementById('legend-emp').innerHTML = `<div class="lgrow"><span class="scale-title">Goals by completion:</span>`+SEGS.map(g=>`<span class="scale-item"><span class="scale-chip" style="background:${g.color};"></span>${g.t}</span>`).join('')+`</div><div class="lgrow"><span class="scale-title">Status:</span><span class="scale-item"><span class="scale-chip" style="background:${GREEN};"></span>Completed</span><span class="scale-item"><span class="scale-chip" style="background:${BRAND};"></span>In Progress</span><span class="scale-item"><span class="scale-chip" style="background:${GREY};"></span>Draft</span></div><div class="lgrow"><span class="scale-title">Needs review:</span><span class="scale-item wide">${triIcon(FLAG_A,13)}Completed but below 100%</span><span class="scale-item wide">${triIcon(FLAG_B,13)}Reached 100%, not Completed</span></div>`;
document.getElementById('emp-head-row').innerHTML = headCells('<th data-k="name">Employee</th><th data-k="sup">Leader</th><th data-k="dept">Department</th>');
const empHead=document.getElementById('emp-head'), empSup=document.getElementById('emp-sup'), empDept=document.getElementById('emp-dept'), empSearch=document.getElementById('emp-search');
if(SINGLE) empHead.style.display='none';
else empHead.innerHTML='<option value="">All Dept Heads</option>'+HEAD_LIST.map(h=>`<option value="${esc(h.name)}">${esc(h.name)}</option>`).join('');
const uniq=a=>[...new Set(a)].sort((x,y)=>String(x).localeCompare(String(y)));
function fillSup(){
  const keep=empSup.value; const list=uniq(EMPS.filter(e=>(!empHead.value||e.head===empHead.value)&&(!empDept.value||e.dept===empDept.value)).map(e=>e.sup).filter(s=>s!=='(Dept Head)'));
  empSup.innerHTML='<option value="">All leaders</option>'+list.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  if(list.includes(keep)) empSup.value=keep;
}
function fillDept(){
  const keep=empDept.value; const list=uniq(EMPS.filter(e=>(!empHead.value||e.head===empHead.value)&&(!empSup.value||e.sup===empSup.value)).map(e=>e.dept));
  empDept.innerHTML='<option value="">All departments</option>'+list.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('');
  if(list.includes(keep)) empDept.value=keep;
}
fillSup(); fillDept();
let eKey='name', eDir=1, VIEW=[];
const CHIPS=[{k:'rev',t:'Needs review',f:e=>e.flagged>0},{k:'u25',t:'Under 25%',f:e=>e.a.b[0]>0},{k:'oor',t:'Over 100% / below 0%',f:e=>e.a.b[4]>0},{k:'off',t:'No longer active',f:e=>e.resigned}];
const CHIP_ON={};
function drawChips(base){
  document.getElementById('emp-chips').innerHTML='<span class="ct">Quick filter:</span>'+CHIPS.map(c=>`<button class="fchip ${CHIP_ON[c.k]?'on':''}" data-c="${c.k}">${c.t}<b>${base.filter(c.f).length}</b></button>`).join('');
}
document.getElementById('emp-chips').addEventListener('click',e=>{ const b=e.target.closest('.fchip'); if(!b) return; CHIP_ON[b.dataset.c]=!CHIP_ON[b.dataset.c]; drawEmp(); });
function drawEmp(){
  const q=empSearch.value.trim().toLowerCase();
  const base=EMPS.filter(e=>(!empHead.value||e.head===empHead.value)&&(!empSup.value||e.sup===empSup.value)&&(!empDept.value||e.dept===empDept.value)&&(!q||e.name.toLowerCase().includes(q)));
  drawChips(base);
  VIEW=base.filter(e=>CHIPS.every(c=>!CHIP_ON[c.k]||c.f(e)));
  VIEW.sort((x,y)=>{ if(x.resigned!==y.resigned) return x.resigned?1:-1; const a=getVal(x,eKey),b=getVal(y,eKey);return (a>b?1:a<b?-1:0)*eDir||x.name.localeCompare(y.name);});   // no-longer-active always last
  document.getElementById('emp-count').textContent=VIEW.length+' employees';
  document.getElementById('emp-body').innerHTML=VIEW.map((e,i)=>`<tr class="click" data-i="${i}"><td><div class="nmrow">${revDot(e)}<b>${esc(e.name)}</b>${e.resigned?'<span class="rtag">No longer active</span>':''}</div></td><td>${esc(e.sup==='(Dept Head)'?'—':e.sup)}</td><td>${esc(e.dept)}</td>${numCells(e.a)}<td class="go">›</td></tr>`).join('')||'<tr><td colspan="10" class="empty">No matching employees.</td></tr>';
}
document.querySelectorAll('#emp-head-row th[data-k]').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k; if(k===eKey) eDir=-eDir; else {eKey=k; eDir=(k==='name'||k==='dept'||k==='sup')?1:-1;} drawEmp();
}));
empHead.addEventListener('change',()=>{fillSup(); fillDept(); drawEmp();});
empSup.addEventListener('change',()=>{fillDept(); drawEmp();}); empDept.addEventListener('change',()=>{fillSup(); drawEmp();}); empSearch.addEventListener('input',drawEmp);
document.getElementById('emp-body').addEventListener('click',e=>{const tr=e.target.closest('tr[data-i]'); if(tr) openEmp(VIEW[+tr.dataset.i]);});
function openTeam(supName, own){
  empSearch.value=''; empDept.value=''; empSup.value='';
  if(!SINGLE) empHead.value=CURD==='__ALL__'?'':CURD;
  fillSup(); fillDept();
  if(own) empSearch.value=supName; else empSup.value=supName;
  fillDept();
  showTab('emp'); drawEmp();
}

// ---- employee modal ----
let CUR=null, FILTER=-1;
const statusPill = s => `<span class="pill ${s==='Completed'?'done':s==='In Progress'?'prog':'draft'}">${esc(s||'—')}</span>`;
const heat = p => { const b=BANDS[bandIdx(p)]; return `<span class="heat" style="background:${b.color};color:${b.ink};">${fmtG(p)}</span>`; };
const bandTag = p => { const b=BANDS[bandIdx(p)]; return `<span class="band-tag" style="--c:${b.color};"><i></i>${b.label}</span>`; };
function statusOf(list){ const st=[...new Set(list.map(x=>x.g.status))]; return st.length===1?statusPill(st[0]):'<span class="pill draft">Mixed</span>'; }
function goalRows(goals,e){
  const seen=new Set(); let out='';
  goals.forEach(x=>{
    if(x.g.fam!=null){
      if(seen.has(x.g.fam)) return; seen.add(x.g.fam);
      const mem=goals.filter(y=>y.g.fam===x.g.fam); const avg=mem.reduce((s,y)=>s+y.g.p,0)/mem.length;
      out+=`<tr class="goal-row fam-row" data-fam="${x.g.fam}"><td>${esc(x.g.name)} <span class="fam-chip">Owner: ${esc(e.name)} · ${mem.length} contributors</span></td><td>${statusOf(mem)}</td><td class="num" title="Average of the ${mem.length} records">${heat(avg)}</td><td>${bandTag(avg)}</td></tr>`;
    } else {
      out+=`<tr class="goal-row" data-gi="${x.i}"><td>${esc(x.g.name)||'<i>(no name)</i>'}${x.g.krs.length?` <span style="color:#5A6B7A;font-size:11px;">· ${x.g.krs.length} KR</span>`:''}</td><td>${statusPill(x.g.status)}${goalFlag(x.g)}</td><td class="num">${heat(x.g.p)}</td><td>${bandTag(x.g.p)}</td></tr>`;
    }
  });
  return out || '<tr><td colspan="4" class="empty">No goals in this band.</td></tr>';
}
function openEmp(e){ CUR=e; FILTER=-1; renderModal(); document.getElementById('modal-overlay').classList.add('open'); }
function renderModal(){
  const e=CUR, a=e.a;
  const fbtn=(i,label,color,cnt)=>`<button class="fbtn ${FILTER===i?'active':''} ${cnt?'':'zero'}" data-f="${i}" style="--c:${color};">${color?'<i></i>':''}${label} (${cnt})</button>`;
  const goals=e.goals.map((g,i)=>({g,i})).filter(x=>FILTER<0||bandIdx(x.g.p)===FILTER).sort((x,y)=>x.g.name.localeCompare(y.g.name));
  document.getElementById('modal-content').innerHTML=`
    <h2>${esc(e.name)}</h2>
    <div class="modal-sub">${e.resigned?'<span class="rtag">No longer active</span> ':''}${esc(e.title||'')}${e.title?' · ':''}${esc(e.dept)}${SINGLE?'':' · Dept Head: '+esc(e.head)} · Leader: ${e.sup==='(Dept Head)'?'—':esc(e.sup)}</div>
    ${e.flagged?`<div class="rev-note">${e.fA?`<span class="rv">${triIcon(FLAG_A)}${e.fA} marked Completed below 100%</span>`:''}${e.fB?`<span class="rv">${triIcon(FLAG_B)}${e.fB} reached 100% but not Completed</span>`:''}</div>`:''}
    <div class="mini-kpis">
      <div><div class="l">Total goals</div><div class="v">${a.n}</div></div>
      <div><div class="l">Completed</div><div class="v">${a.done}</div></div>
      <div><div class="l">In Progress / Draft</div><div class="v">${a.prog} / ${a.draft}</div></div>
      <div><div class="l">Avg completion${info(a,e.name)}</div><div class="v" style="color:${colOf(a.avgCap)}">${fmtP(a.avgCap)}</div></div>
    </div>
    <div class="filters"><span class="f-title">Filter by % band:</span>${fbtn(-1,'All','',a.n).replace('<i></i>','')}${BANDS.map((b,i)=>fbtn(i,b.label,b.color,a.b[i])).join('')}</div>
    <table><thead><tr><th>Goal</th><th>Status</th><th class="num">% complete</th><th>% band</th></tr></thead>
    <tbody>${goalRows(goals,e)}</tbody></table>`;
}
document.getElementById('modal-content').addEventListener('click',ev=>{
  const f=ev.target.closest('.fbtn'); if(f){FILTER=+f.dataset.f; renderModal(); return;}
  const tr=ev.target.closest('tr.goal-row'); if(!tr) return;
  if(tr.dataset.fam!==undefined){
    if(tr.classList.contains('open')){ tr.classList.remove('open'); while(tr.nextElementSibling&&tr.nextElementSibling.dataset.kr==='1') tr.nextElementSibling.remove(); return; }
    tr.classList.add('open');
    const mem=CUR.goals.filter(g=>String(g.fam)===tr.dataset.fam && (FILTER<0||bandIdx(g.p)===FILTER));
    tr.insertAdjacentHTML('afterend',`<tr class="kr-head" data-kr="1"><td colspan="4">Contributors (one record each · total goals are counted by ID)</td></tr>`+mem.map(g=>`<tr class="kr-row" data-kr="1"><td>${esc(g.contrib||'—')} <span style="color:#5A6B7A;font-size:11px">· ID ${g.id}</span></td><td>${statusPill(g.status)}${goalFlag(g)}</td><td class="num">${heat(g.p)}</td><td>${bandTag(g.p)}</td></tr>`).join(''));
    return;
  }
  const g=CUR.goals[+tr.dataset.gi];
  if(tr.classList.contains('open')){ tr.classList.remove('open'); while(tr.nextElementSibling&&tr.nextElementSibling.dataset.kr==='1') tr.nextElementSibling.remove(); return; }
  if(!g.krs.length) return;
  tr.classList.add('open');
  tr.insertAdjacentHTML('afterend',`<tr class="kr-head" data-kr="1"><td colspan="4">KR (sub-goals)</td></tr>`+g.krs.map(k=>`<tr class="kr-row" data-kr="1"><td>${esc(k[0])}</td><td></td><td class="num">${heat(k[1])}</td><td>${bandTag(k[1])}</td></tr>`).join(''));
});
const overlay=document.getElementById('modal-overlay'), closeModal=()=>overlay.classList.remove('open');
overlay.addEventListener('click',e=>{if(e.target===overlay) closeModal();});
document.getElementById('modal-close').addEventListener('click',closeModal);
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal();});

// ---- tabs ----
function showTab(t){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+t));
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
renderDept(); drawEmp();

</script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const msg = (t, btn) => { $('gate-msg').textContent = t; $('gate-btn').style.display = btn ? 'block' : 'none'; };
  // the sign-in popup lands back on this page: let MSAL read the result in the opener, do nothing here
  if (window.opener && window.opener !== window && /[#?&](code|error)=/.test(location.hash + location.search)) { msg('Signing you in…'); return; }
  const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const usePopup = framed || /[?&]popup=1/.test(location.search);
  $('gate-tab').href = location.origin + '/'; if (framed) $('gate-tab').style.display = 'inline-block';

  let cfg;
  try { cfg = await (await fetch('/auth-config.json', { cache: 'no-store' })).json(); } catch (e) { msg('Could not load the sign-in settings. Please reload.'); return; }
  const app = new msal.PublicClientApplication({
    auth: { clientId: cfg.clientId, authority: 'https://login.microsoftonline.com/' + cfg.tenantId, redirectUri: location.origin },
    cache: { cacheLocation: 'sessionStorage' }
  });
  const scopes = ['openid', 'profile', 'email'];

  async function load(idToken) {
    msg('Loading your dashboard…');
    const r = await fetch('/api/data', { headers: { 'X-User-Token': idToken }, cache: 'no-store' });
    if (r.status === 401) throw new Error('auth');
    if (r.status === 403) { msg('You are signed in but not set up for this dashboard yet. Please contact the People Insights team.'); return; }
    if (!r.ok) { msg('Could not load the data. Please reload.'); return; }
    const p = await r.json();
    const s = document.createElement('script');
    s.textContent = 'const DATA = ' + JSON.stringify(p.DATA) + ';\nconst ORG = ' + JSON.stringify(p.ORG) + ';\nconst HEAD_TITLE = ' + JSON.stringify(p.HEAD_TITLE) + ';\nconst META = ' + JSON.stringify(p.META) + ';\n' + $('app-js').textContent;
    document.body.appendChild(s);
    $('gate').remove();
  }
  async function silentToken() {
    const acc = app.getAllAccounts()[0];
    if (acc) { try { return (await app.acquireTokenSilent({ scopes, account: acc })).idToken; } catch (e) {} }
    try { return (await app.ssoSilent({ scopes })).idToken; } catch (e) { return null; }
  }
  async function popupLogin() {
    try { const r = await app.loginPopup({ scopes, prompt: 'select_account' }); return r.idToken; }
    catch (e) { msg('The sign-in window was blocked or closed. Please try again, or use "Open in a new tab".', true); return null; }
  }
  try {
    if (!usePopup) {                                    // opened directly in a browser tab
      const red = await app.handleRedirectPromise();
      let tok = red && red.idToken || await silentToken();
      if (!tok) { msg('Redirecting to Microsoft sign-in…'); await app.loginRedirect({ scopes }); return; }
      await load(tok); return;
    }
    msg('Signing you in…');                             // inside SharePoint (iframe)
    let tok = await silentToken();
    if (tok) { try { await load(tok); return; } catch (e) {} }
    msg('Please sign in with your Microsoft account to see your dashboard.', true);
    $('gate-btn').onclick = async () => { const t = await popupLogin(); if (t) { try { await load(t); } catch (e) { msg('Sign-in failed. Please reload and try again.', true); } } };
  } catch (e) { msg('Could not sign you in. Please reload.', true); $('gate-btn').onclick = () => location.reload(); }
})();
</script>
